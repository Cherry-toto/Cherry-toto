<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6ec4">
        <animate attributeName="stop-color" values="#ff6ec4;#7873f5;#21d4fd;#b721ff;#ff6ec4" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7873f5">
        <animate attributeName="stop-color" values="#7873f5;#21d4fd;#b721ff;#ff6ec4;#7873f5" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#21d4fd">
        <animate attributeName="stop-color" values="#21d4fd;#b721ff;#ff6ec4;#7873f5;#21d4fd" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="320" fill="#0d1117"/>

  <!-- soft moving glow -->
  <circle cx="500" cy="160" r="220" fill="url(#glow)" opacity="0.18">
    <animate attributeName="r" values="200;260;200" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.12;0.28;0.12" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- floating shapes -->
  <circle cx="140" cy="90" r="7" fill="#ff6ec4">
    <animate attributeName="cy" values="90;55;90" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="120" r="9" fill="#21d4fd">
    <animate attributeName="cy" values="120;80;120" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <rect x="210" y="220" width="14" height="14" rx="3" fill="#b721ff">
    <animateTransform attributeName="transform" type="rotate" from="0 217 227" to="360 217 227" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="780" y="210" width="12" height="12" rx="3" fill="#7873f5">
    <animateTransform attributeName="transform" type="rotate" from="360 786 216" to="0 786 216" dur="8s" repeatCount="indefinite"/>
  </rect>
  <polygon points="120,250 132,274 108,274" fill="#4ade80">
    <animate attributeName="points" values="120,250 132,274 108,274;120,236 132,260 108,260;120,250 132,274 108,274" dur="6s" repeatCount="indefinite"/>
  </polygon>

  <!-- title -->
  <text x="500" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="76" font-weight="800" fill="url(#grad)" text-anchor="middle" dominant-baseline="middle">Cherry-toto</text>
  <text x="500" y="232" font-family="'Segoe UI', Arial, sans-serif" font-size="30" fill="#c9d1d9" text-anchor="middle" letter-spacing="2">PHP Backend Developer ✨</text>

  <!-- animated underline -->
  <rect x="350" y="262" width="300" height="5" rx="2.5" fill="url(#grad)">
    <animate attributeName="width" values="120;300;120" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="440;350;440" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
